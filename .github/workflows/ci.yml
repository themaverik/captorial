name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Nothing here launches a browser: the suite covers pure logic only, and replay against a live
      # app is a local activity. Skipping the browser binaries keeps the install to the package tree.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The floor the code is typechecked against, per @types/node.
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
